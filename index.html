<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>포켓몬 엔트리 매니저 Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <style>
        :root {
            /* 테마 변수 (동적 변경) */
            --theme-main: #FF7575;
            --theme-dark: #ED0707;
            --btn-main: #FFCC00;
            --btn-dark: #FDA612;
            --text-main: #1A1A1E;

            /* 고정 환경 변수 */
            --poke-blue: #00E5FF;
            --panel-bg: #FFFFFF;
            --input-bg: #F8F9FA;
            --border-color: #CBD5E1;
        }

        body {
            font-family: 'Galmuri11', sans-serif;
            background-color: #FFFFFF;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .pokedex-container {
            background: linear-gradient(145deg, var(--theme-main), var(--theme-dark));
            width: 100%;
            max-width: 750px;
            border: 6px solid #000;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 4px 0 rgba(255,255,255,0.3);
            padding: 25px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 4px solid #000;
            padding-bottom: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .camera-lens {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 35% 35%, #00E5FF, #0075E9FF);
            border: 4px solid #000;
            border-radius: 50%;
            box-shadow: 0 0 15px #77F1FFFF, inset -4px -4px 8px rgba(0,0,0,0.5);
            margin-right: 15px;
            position: relative;
        }

        .camera-lens::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px; width: 10px; height: 10px;
            background: #fff; border-radius: 50%; opacity: 0.7;
        }

        .status-leds { display: flex; gap: 8px; }
        .led { width: 12px; height: 12px; border: 2px solid #000; border-radius: 50%; }
        .led.red { background-color: #FF4B4B; }
        .led.yellow { background-color: #FFCC00; }
        .led.green { background-color: #00E676; }

        .title {
            color: white;
            text-shadow: 3px 3px 0 #000;
            font-size: 22px;
            margin: 0;
            letter-spacing: 1px;
        }

        .settings-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 26px;
            padding: 0;
            transition: transform 0.3s;
            outline: none;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }
        .settings-btn:hover {
            transform: rotate(45deg);
        }

        .screen {
            background-color: var(--panel-bg);
            border: 5px solid #000;
            border-radius: 12px;
            padding: 20px;
            color: var(--text-main);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            transition: color 0.3s;
        }

        .screen.result-mode {
            background-color: #FFFFFF;
            box-shadow: none;
        }

        .page-block { display: none; }
        .page-block.active { display: block; }

        .form-group { margin-bottom: 18px; }
        .form-group.half {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-main);
            opacity: 0.9;
            white-space: nowrap;
            transition: color 0.3s;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            color: #1A1A1E;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--theme-main);
            background-color: #FFFFFF;
        }
        textarea { resize: vertical; min-height: 70px; }

        .color-picker-group { display: flex; gap: 12px; align-items: center; }
        .color-wrapper {
            position: relative; width: 40px; height: 40px;
            border-radius: 6px; border: 2px solid var(--border-color); overflow: hidden;
        }
        input[type="color"] {
            position: absolute; top: -5px; left: -5px; width: 50px; height: 50px; cursor: pointer;
        }

        .filter-checkbox-group {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            background: #F1F5F9;
            padding: 10px 14px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            flex-wrap: wrap;
        }
        .filter-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }
        .filter-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--theme-main);
        }

        .type-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 6px; 
        }
        .type-btn {
            background: #F1F5F9; border: 2px solid var(--border-color); color: #475569;
            padding: 8px 2px; border-radius: 4px; cursor: pointer; font-size: 11px; text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .type-btn.selected {
            background: #1A1A1E; color: #00E5FF; border-color: #000; font-weight: bold;
        }

        button.submit-btn, button.reset-btn {
            background: linear-gradient(180deg, var(--btn-main), var(--btn-dark));
            color: var(--text-main); font-family: inherit; font-size: 16px; font-weight: bold;
            border: 3px solid #000; border-radius: 8px; padding: 14px; width: 100%;
            cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #000;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s, color 0.3s;
        }
        button.submit-btn:active, button.reset-btn:active {
            transform: translateY(4px); box-shadow: 0 0 0 #000;
        }
        button.reset-btn {
            margin-top: 30px; font-size: 14px; padding: 10px;
        }

        /* 결과창 요소 디자인 */
        .profile-section {
            background-color: #F8F9FA;
            border: 3px solid #000000;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 4px 4px 0px #000000;
        }
        .profile-title {
            font-size: 18px; color: var(--theme-main); margin-top: 0; margin-bottom: 15px;
            border-bottom: 3px solid #000000; padding-bottom: 8px;
            font-weight: bold;
            transition: color 0.3s;
        }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .info-item { font-size: 13px; line-height: 1.6; color: var(--text-main); }
        .info-item strong { display: inline-block; width: 60px; white-space: nowrap; opacity: 0.8; }
        .info-full { grid-column: 1 / -1; border-top: 2px dashed #CBD5E1; padding-top: 12px; }
        .info-full strong { display: block; width: auto; margin-bottom: 5px; }
        
        .entry-header-box { margin-bottom: 20px; }
        .entry-title {
            font-size: 16px; color: var(--text-main); margin: 0 0 8px 0;
            border-left: 5px solid var(--theme-main); padding-left: 10px; font-weight: bold;
            transition: border-color 0.3s, color 0.3s;
        }
        .entry-catchphrase {
            font-size: 13px; color: var(--text-main); opacity: 0.7; padding-left: 15px; font-style: italic; font-weight: bold;
        }

        .entry-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        
        .pokemon-card {
            background-color: #FFFFFF; border: 3px solid #000000; border-radius: 12px;
            padding: 12px; text-align: center; cursor: pointer; box-shadow: 3px 3px 0px #000000;
            position: relative; transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .pokemon-card:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000000; }
        .pokemon-img { width: 100%; height: 110px; object-fit: contain; margin-bottom: 8px; background-color: #FAFAFA; border-radius: 6px; }
        .pokemon-name { font-size: 14px; font-weight: bold; margin: 4px 0; color: #000; }
        .pokemon-type { display: inline-block; font-size: 10px; background-color: #1A1A1E; color: #00E5FF; padding: 2px 6px; border-radius: 4px; }
        .ace-badge {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            background-color: var(--theme-dark); color: white; font-size: 9px; font-weight: bold;
            padding: 2px 8px; border: 2px solid #000; border-radius: 20px; white-space: nowrap;
        }

        /* 모달 (기본 및 설정 공용) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 9999;
            padding: 10px; box-sizing: border-box;
        }
        .modal-content {
            background-color: #FFFFFF; border: 4px solid #000000; border-radius: 20px;
            width: 100%; max-width: 580px; padding: 24px; box-shadow: 6px 6px 0px #000000;
            position: relative; box-sizing: border-box; color: #1A1A1E;
            max-height: 85vh; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .modal-close-btn {
            position: absolute; top: 15px; right: 15px; background: #000; color: #fff;
            border: none; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 11px; border-radius: 4px;
        }
        .modal-header-area {
            border-bottom: 3px solid #000; padding-bottom: 12px; margin-bottom: 20px;
            padding-right: 50px;
        }
        .modal-name { font-size: 22px; color: var(--theme-main); margin: 0 0 6px 0; font-weight: bold; }
        .modal-type { display: inline-block; font-size: 11px; background-color: #1A1A1E; color: #00E5FF; padding: 3px 8px; border-radius: 4px; }
        
        .modal-spec-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            background-color: #F1F5F9; border: 2px solid #000; border-radius: 8px;
            padding: 12px; margin-bottom: 20px;
        }
        .spec-item { font-size: 12px; color: #334155; }
        .spec-item strong { color: var(--theme-dark); }

        .modal-section { 
            background: #F8F9FA; border: 2px solid #CBD5E1; border-radius: 10px;
            padding: 15px; margin-bottom: 15px; 
        }
        .modal-section.highlight { border-color: var(--btn-main); background: #FFFDF4; }
        .modal-section-title { font-size: 13px; font-weight: bold; color: #1A1A1E; margin-bottom: 12px; border-left: 4px solid var(--theme-main); padding-left: 8px; }
        .modal-section.highlight .modal-section-title { border-left-color: var(--theme-dark); }
        .modal-text { font-size: 13px; line-height: 1.6; margin: 0; color: #334155; white-space: pre-wrap; }

        /* 테마 설정 모달 전용 스타일 */
        .theme-preset-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
        }
        .preset-btn {
            border: 2px solid #000; border-radius: 6px; padding: 10px 0; font-family: inherit;
            font-weight: bold; cursor: pointer; text-align: center; font-size: 13px;
        }
        .custom-theme-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; /* 2x2 그리드로 변경 */
        }
        .custom-theme-grid input[type="color"] {
            width: 100%; height: 40px; cursor: pointer; border: 2px solid #000; border-radius: 6px; padding: 0; background: none; margin-top: 5px;
        }
        .custom-theme-grid label { color: #1A1A1E; font-size: 11px; margin-bottom: 0;}

        .loading {
            text-align: center; display: none; margin-top: 20px;
            font-size: 13px; font-weight: bold; color: var(--btn-main); text-shadow: 1px 1px 0 #000; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .pokedex-container { padding: 15px; border-width: 4px; border-radius: 16px; }
            .title { font-size: 18px; }
            .camera-lens { width: 35px; height: 35px; margin-right: 10px; }
            .screen { padding: 12px; border-width: 4px; }
            
            .form-group.half { grid-template-columns: 1fr; gap: 12px; }
            .type-grid { grid-template-columns: repeat(4, 1fr); gap: 5px; }
            .type-btn { font-size: 12px; padding: 8px 0; }
            
            .entry-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .pokemon-card { padding: 8px; border-width: 2px; }
            .pokemon-img { height: 90px; }
            .pokemon-name { font-size: 13px; }

            .info-grid { grid-template-columns: 1fr; gap: 8px; }
            .info-full { padding-top: 8px; }
            
            .modal-content { padding: 16px; border-width: 3px; }
            .modal-name { font-size: 20px; }
            .modal-spec-grid { grid-template-columns: 1fr; gap: 6px; }

            .theme-preset-grid { grid-template-columns: repeat(2, 1fr); }
            .custom-theme-grid { grid-template-columns: 1fr; gap: 8px; }
        }

        @media (max-width: 380px) {
            .type-grid { grid-template-columns: repeat(3, 1fr); }
            .entry-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="pokedex-container">
    <div class="header">
        <div class="header-left">
            <div class="camera-lens"></div>
            <div class="status-leds">
                <div class="led red"></div>
                <div class="led yellow"></div>
                <div class="led green"></div>
            </div>
        </div>
        <div class="header-right">
            <h1 class="title">ENTRY SYSTEM v1.1</h1>
            <button class="settings-btn" onclick="openSettingsModal()" title="설정">⚙️</button>
        </div>
    </div>

    <div class="screen" id="main-screen">
        <div class="page-block active" id="input-block">
            <div class="form-group half">
                <div>
                    <label for="char-name">CHARACTER NAME (이름)</label>
                    <input type="text" id="char-name" placeholder="예: 레이븐">
                </div>
                <div>
                    <label for="char-age">AGE (나이)</label>
                    <input type="text" id="char-age" placeholder="예: 24세">
                </div>
            </div>

            <div class="form-group half">
                <div>
                    <label for="char-job">JOB (직업)</label>
                    <input type="text" id="char-job" placeholder="예: 고전 음악가">
                </div>
                <div>
                    <label for="char-personality">PERSONALITY (성격)</label>
                    <input type="text" id="char-personality" placeholder="예: 냉철함 / 다정함">
                </div>
            </div>

            <div class="form-group">
                <label for="char-story">NARRATIVE / SETTING (설정 및 서사)</label>
                <textarea id="char-story" placeholder="예: 혹독한 설산에서 조난당했을 때 눈해누의 도움으로 구조된 이후, 얼음 속 숨겨진 따뜻함을 노래하게 되었다."></textarea>
            </div>

            <div class="form-group half">
                <div>
                    <label>PERSONAL COLOR</label>
                    <div class="color-picker-group">
                        <div class="color-wrapper"><input type="color" id="color1" value="#4A90E2"></div>
                        <div class="color-wrapper"><input type="color" id="color2" value="#FFFFFF"></div>
                        <div class="color-wrapper"><input type="color" id="color3" value="#1C1C1E"></div>
                    </div>
                </div>
                <div>
                    <label for="char-extra">EXTRA PREFERENCE (기타 선호)</label>
                    <input type="text" id="char-extra" placeholder="예: 진화형 위주, 몽환적인 분위기">
                </div>
            </div>

            <div class="form-group">
                <label>POKÉMON CATEGORY FILTER (엔트리 범위 제한)</label>
                <div class="filter-checkbox-group">
                    <label class="filter-label">
                        <input type="checkbox" id="include-legendary" checked> 전설의 포켓몬
                    </label>
                    <label class="filter-label">
                        <input type="checkbox" id="include-mythical" checked> 환상의 포켓몬
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>PREFERRED TYPE (선호 타입)</label>
                <div class="type-grid" id="type-container"></div>
            </div>

            <button class="submit-btn" onclick="generateEntry()">DATA SCAN & ANALYSIS START</button>
        </div>

        <div class="loading" id="loading-msg">▶ SYSTEM: 오박사 데이터베이스 검색 중... 삐빅...</div>

        <div class="page-block" id="result-block">
            <div class="profile-section">
                <div class="profile-title">TRAINER ARCHIVE</div>
                <div class="info-grid">
                    <div class="info-item"><strong>이름</strong> <span id="res-name"></span></div>
                    <div class="info-item"><strong>나이</strong> <span id="res-age"></span></div>
                    <div class="info-item"><strong>직업</strong> <span id="res-job"></span></div>
                    <div class="info-item"><strong>성격</strong> <span id="res-personality"></span></div>
                    <div class="info-item info-full"><strong>설정 및 서사</strong><span id="res-story"></span></div>
                </div>
            </div>

            <div class="entry-header-box">
                <div class="entry-title">ANALYZED POKÉMON ENTRY</div>
                <div class="entry-catchphrase" id="res-catchphrase">""</div>
            </div>
            
            <div class="entry-grid" id="pokemon-entry-grid"></div>

            <button class="reset-btn" onclick="backToInput()">◀ 처음으로 돌아가기 (새로 입력)</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal" onclick="closeSettingsOnBg(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeSettingsModal()">닫기 X</button>
        
        <div class="modal-header-area">
            <div class="modal-name">시스템 환경 설정</div>
        </div>
        
        <div class="modal-section highlight">
            <div class="modal-section-title">API 연결 설정</div>
            <div class="form-group" style="margin-bottom: 0;">
                <label style="color: #1A1A1E;">Gemini API KEY</label>
                <input type="password" id="api-key" placeholder="AIzaSy... 여기에 Key를 입력하세요" onchange="saveApiKey()">
            </div>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">테마 프리셋</div>
            <div class="theme-preset-grid">
                <button class="preset-btn" style="background:#FF7575; color:#fff;" onclick="applyPreset('red')">Red</button>
                <button class="preset-btn" style="background:#4FC3F7; color:#000;" onclick="applyPreset('blue')">Blue</button>
                <button class="preset-btn" style="background:#FFD54F; color:#000;" onclick="applyPreset('yellow')">Yellow</button>
                <button class="preset-btn" style="background:#F48FB1; color:#fff;" onclick="applyPreset('pink')">Pink</button>
            </div>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">커스텀 테마 세팅</div>
            <div class="custom-theme-grid">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>도감 메인 컬러</label>
                    <input type="color" id="custom-theme-color" onchange="applyCustomTheme()">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>도감 서브(그라데이션)</label>
                    <input type="color" id="custom-theme-dark-color" onchange="applyCustomTheme()">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>화면 폰트 컬러</label>
                    <input type="color" id="custom-text-color" onchange="applyCustomTheme()">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>메인 버튼 컬러</label>
                    <input type="color" id="custom-btn-color" onchange="applyCustomTheme()">
                </div>
            </div>
        </div>
    </div>
</div>

<div id="pokeModal" class="modal" onclick="closeModalOnBg(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal()">닫기 X</button>
        
        <div class="modal-header-area">
            <div id="modalPokeName" class="modal-name">포켓몬 이름</div>
            <div id="modalPokeType" class="modal-type">타입</div>
        </div>

        <div class="modal-spec-grid">
            <div class="spec-item"><strong>■ 분류:</strong> <span id="modalSpecSpecies">데이터 로딩</span></div>
            <div class="spec-item"><strong>■ 특성:</strong> <span id="modalSpecAbility">데이터 로딩</span></div>
            <div class="spec-item"><strong>■ 신장:</strong> <span id="modalSpecHeight">데이터 로딩</span></div>
            <div class="spec-item"><strong>■ 체중:</strong> <span id="modalSpecWeight">데이터 로딩</span></div>
        </div>
        
        <div class="modal-section">
            <div class="modal-section-title">포켓몬 아카이브 도감 설명</div>
            <p id="modalPokeDesc" class="modal-text">설명</p>
        </div>
        
        <div class="modal-section highlight">
            <div class="modal-section-title">파트너 매칭 사유</div>
            <p id="modalPokeReason" class="modal-text">사유</p>
        </div>
    </div>
</div>

<script>
    const types = ["노말", "불꽃", "물", "풀", "전기", "얼음", "격투", "독", "땅", "비행", "에스퍼", "벌레", "바위", "고스트", "드래곤", "악", "강철", "페어리"];
    const typeContainer = document.getElementById('type-container');
    const selectedTypes = new Set();

    // 테마 설정 프리셋에 서브 컬러(themeDark)를 추가 지정해 탁해짐 방지
    const themePresets = {
        red: { theme: '#ED0707', themeDark: '#FF7575', text: '#1A1A1E', btn: '#FFCC00', btnDark: '#FDA612' },
        blue: { theme: '#4FC3F7', themeDark: '#0245ED', text: '#1A1A1E', btn: '#FCED45', btnDark: '#17EECD'  },
        yellow: { theme: '#FFD54F', themeDark: '#F57F17', text: '#1A1A1E', btn: '#FF7575', btnDark: '#EE4F6C' },
        pink: { theme: '#FE7488', themeDark: '#FFB3D0', text: '#333333', btn: '#B3E2FF', btnDark: '#C58FFF' }
    };

    // 버튼의 호버/액티브 상태 등에만 사용할 명도 조절 함수 (그라데이션 메인에는 사용 안함)
    function adjustColor(color, amount) {
        let usePound = false;
        if (color[0] == "#") { color = color.slice(1); usePound = true; }
        if (color.length === 3) color = color[0] + color[0] + color[1] + color[1] + color[2] + color[2];
        
        let num = parseInt(color, 16);
        let r = (num >> 16) + amount;
        if (r > 255) r = 255; else if (r < 0) r = 0;
        let b = ((num >> 8) & 0x00FF) + amount;
        if (b > 255) b = 255; else if (b < 0) b = 0;
        let g = (num & 0x0000FF) + amount;
        if (g > 255) g = 255; else if (g < 0) g = 0;
        
        return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
    }

    // 테마 적용 (서브 컬러를 직접 입력 받음)
    function applyTheme(themeColor, themeDarkColor, textColor, btnColor, btnDarkColor) {
        const root = document.documentElement;
        root.style.setProperty('--theme-main', themeColor);
        root.style.setProperty('--theme-dark', themeDarkColor);
        root.style.setProperty('--text-main', textColor);
        root.style.setProperty('--btn-main', btnColor);
        root.style.setProperty('--btn-dark', btnDarkColor);
        
        // 커스텀 인풋 동기화
        document.getElementById('custom-theme-color').value = themeColor;
        document.getElementById('custom-theme-dark-color').value = themeDarkColor;
        document.getElementById('custom-text-color').value = textColor;
        document.getElementById('custom-btn-color').value = btnColor;
        document.getElementById('custom-btn-dark-color').value = btnDarkColor;
    }

    function applyPreset(colorName) {
        const p = themePresets[colorName];
        if(p) applyTheme(p.theme, p.themeDark, p.text, p.btn, p.btnDark);
    }

    function applyCustomTheme() {
        const themeC = document.getElementById('custom-theme-color').value;
        const themeDarkC = document.getElementById('custom-theme-dark-color').value;
        const textC = document.getElementById('custom-text-color').value;
        const btnC = document.getElementById('custom-btn-color').value;
        const btnDarkC = document.getElementById('custom-btn-dark-color').value;
        applyTheme(themeC, themeDarkC, textC, btnC, btnDarkC);
    }

    function openSettingsModal() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }
    function closeSettingsOnBg(e) { if(e.target === document.getElementById('settingsModal')) closeSettingsModal(); }

    function saveApiKey() { localStorage.setItem('gemini_pokedex_api_key', document.getElementById('api-key').value.trim()); }

    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_pokedex_api_key');
        if (savedKey) document.getElementById('api-key').value = savedKey;
        applyPreset('red'); // 초기 테마 설정
    };

    types.forEach(type => {
        const btn = document.createElement('div');
        btn.className = 'type-btn';
        btn.innerText = type;
        btn.onclick = () => {
            if (selectedTypes.has(type)) { selectedTypes.delete(type); btn.classList.remove('selected'); }
            else { selectedTypes.add(type); btn.classList.add('selected'); }
        };
        typeContainer.appendChild(btn);
    });

    function backToInput() {
        document.getElementById('result-block').classList.remove('active');
        document.getElementById('main-screen').classList.remove('result-mode');
        document.getElementById('input-block').classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function generateEntry() {
        const apiKey = document.getElementById('api-key').value.trim();
        const name = document.getElementById('char-name').value.trim();
        const age = document.getElementById('char-age').value.trim();
        const job = document.getElementById('char-job').value.trim();
        const personality = document.getElementById('char-personality').value.trim();
        const story = document.getElementById('char-story').value.trim();
        const color1 = document.getElementById('color1').value;
        const color2 = document.getElementById('color2').value;
        const color3 = document.getElementById('color3').value;
        const extra = document.getElementById('char-extra').value.trim();
        const checkedTypes = Array.from(selectedTypes);

        const legendaryAllowed = document.getElementById('include-legendary').checked;
        const mythicalAllowed = document.getElementById('include-mythical').checked;

        if (!apiKey) {
            alert("API KEY를 설정(⚙️) 창에서 입력해주세요!");
            openSettingsModal();
            return;
        }
        if (!name || !story) {
            alert("이름과 설정 및 서사를 입력해주세요!");
            return;
        }

        const loadingMsg = document.getElementById('loading-msg');
        loadingMsg.style.display = 'block';
        loadingMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });

        const legendaryRule = legendaryAllowed ? "전설의 포켓몬을 엔트리에 포함시키는 것을 허용합니다(어울리는 경우 적극 추천)." : "절대로 전설의 포켓몬(예: 뮤츠, 루기아, 디아루가 등)을 엔트리에 포함하지 마십시오. 무조건 일반 포켓몬으로만 구성해야 합니다.";
        const mythicalRule = mythicalAllowed ? "환상의 포켓몬을 엔트리에 포함시키는 것을 허용합니다(어울리는 경우 적극 추천)." : "절대로 환상의 포켓몬(예: 뮤, 세레비, 다크라이, 마샤도 등)을 엔트리에 포함하지 마십시오.";

        const prompt = `
다음 캐릭터 설정을 세밀히 분석해 최적의 6마리 포켓몬 엔트리를 매칭하고 완벽한 JSON 형식으로만 반환하세요.
- 이름: ${name}, 나이: ${age}, 직업: ${job}, 성격: ${personality}
- 서사: ${story}
- 컬러: ${color1}, ${color2}, ${color3}
- 선호 타입: ${checkedTypes.join(', ')}, 기타 조건: ${extra}

[중요 카테고리 필터 제한 규정]
1. ${legendaryRule}
2. ${mythicalRule}

반드시 다음 형식의 규격화된 JSON 구조여야 합니다:
{
  "entry_catchphrase": "엔트리 전체의 시너지를 요약하는 특징적이고 강렬한 한 줄 캐치프레이즈",
  "ace_pokemon_name": "에이스 포켓몬 한글 이름",
  "entry": [
    {
      "name_ko": "포켓몬 한글 이름",
      "name_en": "포켓몬 영문명 (공백/기호 없이 소문자 정밀 기재, 하이픈이나 마침표 기호 전부 제외할 것. 예: roaring-moon -> roaringmoon, type:null -> typenull, mr. mime -> mrmime)",
      "type": "타입 (예: 얼음 / 고스트)",
      "species": "포켓몬 분류 (예: 섀도포켓몬, 봉인포켓몬)",
      "ability": "대표 특성",
      "height": "평균 키 (예: 1.5m)",
      "weight": "평균 몸무게 (예: 40.5kg)",
      "description": "공식 전감도감을 기반으로 하되 캐릭터 분위기와 맞는 핵심 생태학적 특징 설명 (최소 2문장 이상 상세히)",
      "reason": "이 캐릭터의 과거 서사, 성격, 직업, 고유 컬러 등과 얽혀 배치된 깊이 있는 매칭 명분 분석 (최소 3문장 이상 매우 상세히)"
    }
  ]
}
`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: "당신은 캐릭터 기반 포켓몬 데이터베이스 매칭 수석 연구원입니다. 요구한 키들이 누락 없이 채워진 정밀한 JSON만 응답합니다." }] },
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.75, responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error ? data.error.message : "API 에러");

            const resJson = JSON.parse(data.candidates[0].content.parts[0].text);

            document.getElementById('res-catchphrase').innerText = `"${resJson.entry_catchphrase}"`;
            document.getElementById('res-name').innerText = name;
            document.getElementById('res-age').innerText = age ? age : '미정';
            document.getElementById('res-job').innerText = job ? job : '미정';
            document.getElementById('res-personality').innerText = personality ? personality : '미정';
            document.getElementById('res-story').innerHTML = story.replace(/\n/g, '<br>');

            const grid = document.getElementById('pokemon-entry-grid');
            grid.innerHTML = '';

            resJson.entry.forEach(poke => {
                const isAce = poke.name_ko === resJson.ace_pokemon_name;
                const aceTag = isAce ? `<div class="ace-badge">⭐ 에이스</div>` : '';
                
                const cleanNameEn = poke.name_en.toLowerCase().replace(/[^a-z0-9]/g, '').trim();

                const card = document.createElement('div');
                card.className = 'pokemon-card';
                card.innerHTML = `
                    ${aceTag}
                    <img class="pokemon-img" src="https://img.pokemondb.net/artwork/large/${cleanNameEn}.jpg" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png';">
                    <div class="pokemon-name">${poke.name_ko}</div>
                    <div class="pokemon-type">${poke.type}</div>
                `;
                card.onclick = () => openModal(poke);
                grid.appendChild(card);
            });

            loadingMsg.style.display = 'none';
            document.getElementById('input-block').classList.remove('active');
            document.getElementById('main-screen').classList.add('result-mode');
            document.getElementById('result-block').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (error) {
            loadingMsg.style.display = 'none';
            alert(`분석 중 오류 발생: ${error.message}`);
            console.error(error);
        }
    }

    function openModal(poke) {
        document.getElementById('modalPokeName').innerText = poke.name_ko;
        document.getElementById('modalPokeType').innerText = poke.type;
        
        document.getElementById('modalSpecSpecies').innerText = poke.species || '미정';
        document.getElementById('modalSpecAbility').innerText = poke.ability || '미정';
        document.getElementById('modalSpecHeight').innerText = poke.height || '미정';
        document.getElementById('modalSpecWeight').innerText = poke.weight || '미정';
        
        document.getElementById('modalPokeDesc').innerText = poke.description;
        document.getElementById('modalPokeReason').innerText = poke.reason;
        
        document.getElementById('pokeModal').style.display = 'flex';
    }
    
    function closeModal() { document.getElementById('pokeModal').style.display = 'none'; }
    function closeModalOnBg(e) { if(e.target === document.getElementById('pokeModal')) closeModal(); }
</script>

</body>
</html>
